name: CI

# 四个 mod 需要游戏 interop 才能编译，所以 CI 跑纯函数单测和模拟进程的安装器测试。
# 本地/发版前同一条命令：dotnet test Shared.Tests/Shared.Tests.csproj

on:
    push:
        branches:
            - main
            - master
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Run unit tests
              run: dotnet test Shared.Tests/Shared.Tests.csproj -c Release --nologo

            - name: Check version consistency
              # 唯一事实源 Shared/GitVersion.cs，插件与启动补丁的 <Version> 必须一致（AGENT.md）
              run: |
                  ver=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' Shared/GitVersion.cs)
                  echo "GitVersion.cs: $ver"
                  for csproj in ScorePreview/ScorePreview.csproj SLMenuTrigger/SLMenuTrigger.csproj AutoContinue/AutoContinue.csproj LingPreview/LingPreview.csproj Compatibility/Compatibility.csproj; do
                    csv=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' "$csproj")
                    if [ "$csv" != "$ver" ]; then
                      echo "::error::$csproj <Version>=$csv, expected $ver (run set-version.ps1)"
                      exit 1
                    fi
                    echo "$csproj: $csv OK"
                  done

    installer:
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Test installer without launching a game
              shell: powershell
              run: .\tools\tests\installer.Tests.ps1
