name: Create Release

on:
    push:
        tags:
            - v*


# release 必须写权限
permissions:
    contents: write


jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create Source Zip
              run: zip -r source.zip . -x "*.git*" "bin/*" "obj/*"

            - name: Generate SHA-256 Checksum
              run: sha256sum source.zip > source.zip.sha256

            - name: Create Release and Upload Assets
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      source.zip
                      source.zip.sha256
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

